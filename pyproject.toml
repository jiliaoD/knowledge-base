[project]
name = "knowledge-base"
version = "0.1.0"
description = "产品手册智能问答 —— 基于 LangGraph 的 RAG 产品手册知识库问答系统"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.1",
    "openai-agents>=0.22.2",
    "mcp<2",
    "dashscope>=1.27.6",
]
[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
